<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админ — Генератор номеров</title>
  <style>
    body { font-family: sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 16px; }
    input, button, select { padding: 8px; margin: 4px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #e6edf3; }
    button { background: #238636; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { border: 1px solid #30363d; padding: 8px; text-align: left; font-size: 13px; }
    th { background: #161b22; }
    .stats { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .stat-box { background: #161b22; padding: 12px 20px; border-radius: 8px; }
    #loginBox { max-width: 300px; margin: 100px auto; text-align: center; }
    #panel { display: none; }
  </style>
</head>
<body>
  <div id="loginBox">
    <h2>Админ-панель</h2>
    <input type="password" id="pass" placeholder="Пароль">
    <br><button onclick="login()">Войти</button>
  </div>

  <div id="panel">
    <h1>Админ-панель</h1>
    <div class="stats" id="stats"></div>
    <input type="text" id="searchId" placeholder="Поиск по ID">
    <button onclick="loadUsers()">Обновить</button>
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Имя</th><th>₽</th><th>$</th><th>Дата</th><th>Статус</th><th>Действия</th>
        </tr>
      </thead>
      <tbody id="usersTable"></tbody>
    </table>
  </div>

  <script>
    const API = window.location.origin;
    let password = '';

    async function login() {
      password = document.getElementById('pass').value;
      const res = await fetch(API + '/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      }).then(r => r.json());
      if (res.success) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('panel').style.display = 'block';
        loadUsers();
      } else alert('Неверный пароль');
    }

    async function loadUsers() {
      const res = await fetch(API + '/api/admin/users', {
        headers: { 'x-admin-password': password }
      }).then(r => r.json());

      document.getElementById('stats').innerHTML = `
        <div class="stat-box">Всего игроков: ${res.stats.total_users}</div>
        <div class="stat-box">Всего денег: ${Math.floor(res.stats.total_money)} ₽</div>
        <div class="stat-box">Активных сегодня: ${res.stats.active_today}</div>
      `;

      const search = document.getElementById('searchId').value;
      let users = res.users;
      if (search) users = users.filter(u => String(u.id).includes(search));

      document.getElementById('usersTable').innerHTML = users.map(u => `
        <tr>
          <td>${u.id}</td>
          <td>${u.username}</td>
          <td>${Math.floor(u.balance_rub)}</td>
          <td>${u.balance_usd}</td>
          <td>${u.created_at?.slice(0,10)}</td>
          <td>${u.is_banned ? '🚫 бан' : u.is_admin ? '👑 админ' : '✅'}</td>
          <td>
            <input type="number" id="money-${u.id}" placeholder="Сумма" style="width:70px">
            <button onclick="grant(${u.id})">Выдать ₽</button>
            <input type="text" id="plate-${u.id}" placeholder="Номер" style="width:90px">
            <button onclick="grantPlate(${u.id})">Выдать номер</button>
            <button onclick="ban(${u.id}, ${u.is_banned ? 0 : 1})">${u.is_banned ? 'Разбан' : 'Бан'}</button>
            ${!u.is_admin ? `<button onclick="makeAdmin(${u.id})">Админ</button>` : ''}
          </td>
        </tr>
      `).join('');
    }

    async function grant(id) {
      const amount = +document.getElementById('money-' + id).value;
      if (!amount) return;
      await fetch(API + '/api/admin/grant', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-password': password },
        body: JSON.stringify({ user_id: id, amount })
      });
      loadUsers();
    }

    async function grantPlate(id) {
      const plate = document.getElementById('plate-' + id).value;
      if (!plate) return;
      await fetch(API + '/api/admin/grant', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-password': password },
        body: JSON.stringify({ user_id: id, plate })
      });
      loadUsers();
    }

    async function ban(id, ban) {
      await fetch(API + '/api/admin/ban', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-password': password },
        body: JSON.stringify({ user_id: id, ban })
      });
      loadUsers();
    }

    async function makeAdmin(id) {
      await fetch(API + '/api/admin/make-admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-password': password },
        body: JSON.stringify({ user_id: id })
      });
      loadUsers();
    }
  </script>
</body>
</html>
